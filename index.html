<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carrera GO!!! Box</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&family=Saira:wght@400;600&display=swap">
<style>
:root{--bg:#0e1116;--panel:#171b22;--line:#2c333e;--fg:#eef1f5;--mut:#8c96a5;--accent:#ffd400;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:16px/1.4 "Saira",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
h1{font:800 clamp(36px,8vw,64px)/1 "Saira Condensed","Arial Narrow",sans-serif;text-transform:uppercase;margin:0;text-align:center}
h1 span{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;width:min(720px,100%)}
a{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;color:var(--fg);text-decoration:none}
a:hover,a:focus-visible{border-color:var(--accent);outline:none}
a b{font:800 30px/1 "Saira Condensed","Arial Narrow",sans-serif;text-transform:uppercase}
a span{color:var(--mut)}
</style>
</head>
<body>
<h1>Carrera GO<span>!!!</span></h1>
<div class="grid">

  <a href="Carrera-GO-Bahnplaner.html"><b>🛤 Bahnplaner</b><span>Strecken planen, generieren und drucken</span></a>
</div>
</body>
</html>
